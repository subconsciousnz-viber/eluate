[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eluate"
version = "0.1.0b0"  # PEP 440 spelling of the app's 0.1.0-beta
description = "Offline non-causal auto-mastering engine (prototype)"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
# Upper bounds stop at the next minor past the versions verified on Windows x64 (numpy 2.5.4,
# scipy 1.18.1, soundfile 0.14.0, librosa 1.0.0, numba 0.68.0; requirements/lock-*.txt holds
# the exact sets). scipy is held to its verified minor series because oa.py imports the
# private scipy.signal._signaltools._calc_oa_lens. numba is reached only through librosa
# (pyin, beat_track), bounded because it compiles the kernels those features run.
dependencies = [
    "numpy>=2.0,<2.6",
    "scipy>=1.13,<1.19",
    "soundfile>=0.12,<0.15",
    "librosa>=0.10,<1.1",
    "numba>=0.59,<0.69",
]

[project.scripts]
eluate = "eluate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pyloudnorm>=0.1.1", "matplotlib>=3.8"]
demucs = ["demucs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: takes more than about 5 s; CI's fast job runs -m \"not slow\" (the full suite runs weekly)",
]
