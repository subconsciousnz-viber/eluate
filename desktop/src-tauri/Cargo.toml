[package]
name = "eluate"
version = "0.1.0-beta"
description = "Eluate: offline auto-mastering, desktop shell"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.77.2"

[lib]
name = "eluate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
ureq = "2"                   # opt-in vote sending (votes.rs): blocking HTTPS, rustls

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
