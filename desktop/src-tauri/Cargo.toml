[package]
name = "eluate"
version = "0.2.0"
description = "Eluate: offline auto-mastering, desktop shell"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.79"         # std::path::absolute (lib.rs canon's fallback)

[lib]
name = "eluate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
ureq = "2"                   # opt-in vote sending (votes.rs): blocking HTTPS, rustls

# Engine children die with the shell (lib.rs `tie_to_shell`): a Job Object on Windows,
# PR_SET_PDEATHSIG on Linux. Both crates were already in the lock through tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
